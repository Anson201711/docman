server:
  port: 8084

spring:
  application:
    name: docman-search
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}
  datasource:
    url: jdbc:mysql://localhost:3306/docman_search?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.docman.search.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
