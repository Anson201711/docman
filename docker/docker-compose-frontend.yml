# ============================================
# DocMan Frontend Standalone Docker Compose
# ============================================

services:
  frontend:
    image: docman-frontend:latest
    container_name: docman-frontend
    ports:
      - "3000:3000"
    networks:
      - docman-network
    restart: always

# ============================================
# Networks
# ============================================
networks:
  docman-network:
    external: true
    name: docman-network

