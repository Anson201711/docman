# ============================================
# DocMan Backend Only Docker Compose
# Starts only backend services (independent JARs)
# Does NOT start MySQL, Redis, Elasticsearch, MinIO, Frontend
# External middleware required
# ============================================

services:
  # -----------------------------------------
  # Gateway Service
  # -----------------------------------------
  gateway:
    build:
      context: ../..
      dockerfile: docker/Dockerfile-backend
      target: runtime-distributed
    image: docman-backend-distributed:latest
    container_name: docman-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVICE_JAR=docman-gateway.jar
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=distributed
      - NACOS_HOST=${NACOS_HOST:-nacos}
      - NACOS_PORT=${NACOS_PORT:-8848}
    networks:
      - docman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -----------------------------------------
  # User Service
  # -----------------------------------------
  user:
    build:
      context: ../..
      dockerfile: docker/Dockerfile-backend
      target: runtime-distributed
    image: docman-backend-distributed:latest
    container_name: docman-user
    ports:
      - "8081:8081"
    environment:
      - SERVICE_JAR=docman-user.jar
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=distributed
      - NACOS_HOST=${NACOS_HOST:-nacos}
      - NACOS_PORT=${NACOS_PORT:-8848}
      - MYSQL_HOST=${MYSQL_HOST:-localhost}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=docman_user
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root123}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
    networks:
      - docman-network
    restart: unless-stopped

  # -----------------------------------------
