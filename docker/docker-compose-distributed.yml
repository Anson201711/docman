      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=docman
      - MYSQL_PASSWORD=docman123
      - MYSQL_DATABASE=docman_subscription
      - REDIS_HOST=redis
      - REDIS_PORT=6379
