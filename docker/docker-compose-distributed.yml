    environment:
      - SPRING_PROFILES_ACTIVE=distributed
      - PROFILE=distributed
      - SERVICE_TYPE=collaboration
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=docman
      - MYSQL_PASSWORD=docman123
      - MYSQL_DATABASE=docman_collaboration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JVM_XMS=256m
      - JVM_XMX=512m
    depends_on:
      mysql:
        condition: service_healthy
