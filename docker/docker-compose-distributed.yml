# ============================================
# DocMan Distributed Mode Docker Compose
# Each microservice runs in its own container
# ============================================

services:
  # -----------------------------------------
  # Frontend - Next.js Application
  # -----------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
        BUILD_ENV: production
    container_name: docman-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - docman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -----------------------------------------
  # Gateway Service
  # -----------------------------------------
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
      args:
        PROFILE: distributed
        SPRING_PROFILES_ACTIVE: distributed
    container_name: docman-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=distributed
      - PROFILE=distributed
      - SERVICE_TYPE=gateway
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JVM_XMS=256m
      - JVM_XMX=512m
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------
  # User Service
  # -----------------------------------------
  user-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
      args:
        PROFILE: distributed
        SPRING_PROFILES_ACTIVE: distributed
    container_name: docman-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=distributed
      - PROFILE=distributed
      - SERVICE_TYPE=user
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=docman
      - MYSQL_PASSWORD=docman123
      - MYSQL_DATABASE=docman_user
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JVM_XMS=256m
      - JVM_XMX=512m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - docman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------
  # Document Service
  # -----------------------------------------
  document-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
      args:
        PROFILE: distributed
        SPRING_PROFILES_ACTIVE: distributed
