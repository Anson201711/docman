# ============================================
# DocMan Standalone Mode Docker Compose
# Single JAR containing all services
# ============================================

services:
  # -----------------------------------------
  # MySQL Database
  # -----------------------------------------
  mysql:
    image: mysql:8.0
    container_name: docman-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_USER=docman
      - MYSQL_PASSWORD=docman123
      - MYSQL_DATABASE=docman
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql.conf:/etc/mysql/conf.d/custom.cnf:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - docman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------
  # Redis Cache
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: docman-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - docman-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------
  # MinIO Object Storage
  # -----------------------------------------
  minio:
    image: minio/minio:latest
    container_name: docman-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=docman-documents,docman-cad,docman-thumbnails
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - docman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # -----------------------------------------
  # Elasticsearch
  # -----------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: docman-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ELASTIC_PASSWORD=elastic"
      - "TEST_USER=user1"
      - "TEST_USER_ROLE=superuser"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - docman-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# Networks
# ============================================
networks:
  docman-network:
    external: true
    name: docman-network

# ============================================
# Volumes
# ============================================
volumes:
  mysql-data:
    driver: local
    name: docman-mysql-data
  redis-data:
    driver: local
    name: docman-redis-data
  minio-data:
    driver: local
    name: docman-minio-data
  es-data:
    driver: local
    name: docman-es-data
