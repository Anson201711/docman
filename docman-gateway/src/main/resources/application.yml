spring:
  application:
    name: docman-gateway
  cloud:
    gateway:
      routes:
        # User Service
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**,/api/auth/**,/api/groups/**
          filters:
            - StripPrefix=1

        # Document Service
        - id: document-service
          uri: http://document-service:8082
          predicates:
            - Path=/api/documents/**,/api/folders/**,/api/trash/**
          filters:
            - StripPrefix=1

        # Storage Service
        - id: storage-service
          uri: http://storage-service:8083
          predicates:
            - Path=/api/storage/**
          filters:
            - StripPrefix=1

        # Search Service
        - id: search-service
          uri: http://search-service:8084
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=1

        # Version Service
        - id: version-service
          uri: http://version-service:8085
          predicates:
            - Path=/api/versions/**
          filters:
            - StripPrefix=1

        # Classification Service
        - id: classification-service
          uri: http://classification-service:8086
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1

        # Approval Service
        - id: approval-service
          uri: http://approval-service:8087
          predicates:
            - Path=/api/approvals/**
          filters:
            - StripPrefix=1

        # Subscription Service
        - id: subscription-service
          uri: http://subscription-service:8088
          predicates:
            - Path=/api/subscriptions/**,/api/notifications/**
          filters:
            - StripPrefix=1

        # Collaboration Service
        - id: collaboration-service
          uri: http://collaboration-service:9089
          predicates:
            - Path=/api/collaborations/**
          filters:
            - StripPrefix=1

        # CAD Service
        - id: cad-service
          uri: http://cad-service:8090
          predicates:
            - Path=/api/cad/**
          filters:
            - StripPrefix=1

        # System Service
        - id: system-service
          uri: http://system-service:8091
          predicates:
            - Path=/api/system/**,/api/logs/**
          filters:
            - StripPrefix=1

      # Global default filters
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestSize
          args:
            maxSize: 100MB

  # Redis for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

server:
  port: ${GATEWAY_PORT:8080}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.docman: DEBUG
