spring:
  main:
    web-application-type: reactive
  application:
    name: docman-gateway
  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # User Service - standalone uses direct localhost routing
        - id: user-service
          uri: http://localhost:9081
          predicates:
            - Path=/api/users/**,/api/auth/**,/api/groups/**
          filters:
            - StripPrefix=1

        # Document Service
        - id: document-service
          uri: http://localhost:9082
          predicates:
            - Path=/api/documents/**,/api/folders/**,/api/trash/**
          filters:
            - StripPrefix=1

        # Storage Service
        - id: storage-service
          uri: http://localhost:9083
          predicates:
            - Path=/api/storage/**
          filters:
            - StripPrefix=1

        # Search Service
        - id: search-service
          uri: http://localhost:9084
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=1

        # Version Service
        - id: version-service
          uri: http://localhost:9085
          predicates:
            - Path=/api/versions/**
          filters:
            - StripPrefix=1

        # Classification Service
        - id: classification-service
          uri: http://localhost:9086
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1

        # Approval Service
        - id: approval-service
          uri: http://localhost:9087
          predicates:
            - Path=/api/approvals/**
          filters:
            - StripPrefix=1

        # Subscription Service
        - id: subscription-service
          uri: http://localhost:9088
          predicates:
            - Path=/api/subscriptions/**,/api/notifications/**
          filters:
            - StripPrefix=1

        # Collaboration Service
        - id: collaboration-service
          uri: http://localhost:9089
          predicates:
            - Path=/api/collaborations/**
          filters:
            - StripPrefix=1

        # CAD Service
        - id: cad-service
          uri: http://localhost:9090
          predicates:
            - Path=/api/cad/**
          filters:
            - StripPrefix=1

        # System Service
        - id: system-service
          uri: http://localhost:9091
          predicates:
            - Path=/api/system/**,/api/logs/**
          filters:
            - StripPrefix=1

      # Global default filters
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestSize
          args:
            maxSize: 100MB

  # Redis for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

server:
  port: ${GATEWAY_PORT:9080}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.docman: DEBUG
